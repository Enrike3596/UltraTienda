$kind: collection
description: |-
  order_id debe existir; payment_date fecha o null.
  CÓMO USAR ESTA COLECCIÓN (importar en Postman: Import > File, o arrastrar el archivo):
  1. Importa UNA sola vez el entorno postman/UltraTienda-API.postman_environment.json y selecciónalo arriba a la derecha.
  2. Si es la primera vez, ejecuta la colección 01-auth: POST "POST login - obtener token" guarda el token en {{token}}.
  3. Con el token activo, importa y ejecuta los demás módulos (02 a 08).
  baseUrl = http://127.0.0.1:8000 (cámbialo si el servidor corre en otro puerto).
variables:
  baseUrl: http://127.0.0.1:8000
  token: ""
auth:
  - id: 00d577fc-3091-406c-bd59-dcaf9d12de75
    type: bearer
    name: bearer auth
    credentials:
      token: "{{token}}"
