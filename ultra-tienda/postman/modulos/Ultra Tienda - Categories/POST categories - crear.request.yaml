$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Juguetes Test",
      "description": "Categoria de prueba desde Postman",
      "orden": 6,
      "is_active": true
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
