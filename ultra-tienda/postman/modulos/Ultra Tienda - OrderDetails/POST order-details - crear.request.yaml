$kind: http-request
url: "{{baseUrl}}/api/order-details"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "order_id": 1,
      "product_id": 1,
      "quantity": 2,
      "price": 149900
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
