$kind: http-request
url: "{{baseUrl}}/api/order-details/1"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "order_id": 1,
      "product_id": 1,
      "quantity": 3,
      "price": 149900
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 4000
